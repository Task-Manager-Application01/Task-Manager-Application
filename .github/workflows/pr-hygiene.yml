name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Require linked requirement IDs in PR description
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            // Expect at least one SRS requirement ID such as REQ-3.1
            if (!/REQ-\d+\.\d+/.test(body)) {
              core.setFailed('PR description must reference at least one SRS requirement ID (e.g. REQ-3.1).');
            }
      - name: Label PR by author
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['sprint-1']
            }).catch(() => {});
